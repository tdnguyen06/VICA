spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  ai:
    chat:
      observations:
        log-completion: false           # don't write user prompts/answers to logs in prod
        log-prompt: false
    vectorstore:
      observations:
        log-query-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info            # base application.yml exposes "*" (env, heapdump, ...)

logging:
  level:
    org.springframework.ai.rag: info

arconia:
  otel:
    traces:
      enabled: false                    # no collector in this stack
    metrics:
      enabled: false
    logs:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
