spring:
  application:
    name: rag-conditional
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 768       # keep pgvector's existing 768-dimensional schema
    chat:
      observations:
        log-completion: true
        log-prompt: true
    vectorstore:
      observations:
        log-query-response: true
      pgvector:
        initialize-schema: true
        dimensions: 768       # must equal spring.ai.openai.embedding.dimensions
        index-type: hnsw
  threads:
    virtual:
      enabled: true

logging:
  level:
    org.springframework.ai.rag: debug

management:
  endpoints:
    web:
      exposure:
        include: "*"

arconia:
  otel:
    metrics:
      exporter:
        interval: 5s
