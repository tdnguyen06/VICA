spring:
  application:
    name: vietnam-cultural-atlas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${AI_API_KEY:test-dummy-key-for-bootstrap}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gemini-2.5-flash}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-004}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Core Application Settings
app:
  version: "1.0.0"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:culturalAtlasSecretKeyForDevelopmentPhaseMustBeAtLeast32BytesLong!}
    access-expiration-ms: ${JWT_EXPIRATION_MS:3600000}            # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:}  # OAuth Web client id; empty = Google login disabled
  mail:
    # false = dev mode: codes are written to the backend log instead of being emailed
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@vica.local}
  verification:
    ttl-minutes: ${VERIFICATION_TTL_MINUTES:10}
  admin-emails: ${ADMIN_EMAILS:}   # email admin, cach nhau bang dau phay; duoc nang ROLE_ADMIN khi dang nhap

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

