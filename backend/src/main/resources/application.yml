spring:
  application:
    name: vietnam-cultural-atlas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Core Application Settings
app:
  version: "1.0.0"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:culturalAtlasSecretKeyForDevelopmentPhaseMustBeAtLeast32BytesLong!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ai:
    provider: ${AI_PROVIDER:gemini}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gemini-1.5-flash}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-004}
    enabled: ${AI_ENABLED:false}
    top-k: ${AI_TOP_K:5}
    similarity-threshold: ${AI_SIMILARITY_THRESHOLD:0.75}

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

